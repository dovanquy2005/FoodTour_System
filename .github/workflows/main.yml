name: Build and Deploy FoodTour APK

on:
  push:
    #branches: [ "main" ]  <-- DÒNG NÀY ĐI COMMENT ĐỂ CHỈ CHẠY KHI TẠO TAG
    tags:
      - 'v*' # Chạy khi bạn tạo tag mới như v1.0, v1.1...

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui-android

    - name: Restore dependencies
      run: dotnet restore FoodTour.Mobile/FoodTour.Mobile.csproj

    - name: Build and Publish APK
      run: |
        dotnet publish FoodTour.Mobile/FoodTour.Mobile.csproj `
        -f net9.0-android `
        -c Release `
        -r android-arm64 `
        --self-contained true `
        /p:AndroidKeyStore=true `
        /p:AndroidSigningKeyStore=foodtour.keystore `
        /p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }} `
        /p:AndroidSigningKeyPass=${{ secrets.KEYSTORE_PASSWORD }} `
        /p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}

    # BƯỚC MỚI: TỰ ĐỘNG ĐỔI TÊN FILE
    - name: Rename APK to foodtour.apk
      shell: pwsh
      run: |
        $oldFile = Get-ChildItem -Path "FoodTour.Mobile/bin/Release/net9.0-android/android-arm64/" -Filter "*-Signed.apk" | Select-Object -First 1
        $newPath = "FoodTour.Mobile/bin/Release/net9.0-android/android-arm64/foodtour.apk"
        Move-Item -Path $oldFile.FullName -Destination $newPath
        Write-Host "Đã đổi tên file thành: $newPath"

    # Cập nhật lại đường dẫn ở bước Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoodTour-App
        path: FoodTour.Mobile/bin/Release/net9.0-android/android-arm64/foodtour.apk
        retention-days: 30

    # Cập nhật lại đường dẫn ở bước Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: FoodTour.Mobile/bin/Release/net9.0-android/android-arm64/foodtour.apk
        name: Release ${{ github.ref_name }}
        body: "Bản cập nhật mới nhất cho ứng dụng FoodTour."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}