name: Build and Deploy FoodTour APK

on:
  push:
    branches: [ "main" ] # Tự động chạy khi bạn push code lên nhánh main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui-android

    - name: Restore dependencies
      run: dotnet restore FoodTour.Mobile/FoodTour.Mobile.csproj

    - name: Build and Publish APK
      run: |
        dotnet publish FoodTour.Mobile/FoodTour.Mobile.csproj `
        -f net9.0-android `
        -c Release `
        -r android-arm64 `
        --self-contained true `
        /p:AndroidKeyStore=true `
        /p:AndroidSigningKeyStore=foodtour.keystore `
        /p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }} `
        /p:AndroidSigningKeyPass=${{ secrets.KEYSTORE_PASSWORD }} `
        /p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}

    # THAY THẾ BƯỚC SUPABASE BẰNG GITHUB ARTIFACTS
    - name: Upload APK to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FoodTour-App
        # Đường dẫn tìm file APK đã ký sau khi build
        path: FoodTour.Mobile/bin/Release/net9.0-android/android-arm64/*-Signed.apk
        # Lưu trữ trong 7 ngày để tiết kiệm dung lượng repo
        retention-days: 7