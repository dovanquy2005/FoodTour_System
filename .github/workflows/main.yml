name: Build and Deploy FoodTour APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Chạy khi bạn tạo tag mới như v1.0, v1.1...

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui-android

    - name: Restore dependencies
      run: dotnet restore FoodTour.Mobile/FoodTour.Mobile.csproj

    - name: Build and Publish APK
      run: |
        dotnet publish FoodTour.Mobile/FoodTour.Mobile.csproj `
        -f net9.0-android `
        -c Release `
        -r android-arm64 `
        --self-contained true `
        /p:AndroidKeyStore=true `
        /p:AndroidSigningKeyStore=foodtour.keystore `
        /p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }} `
        /p:AndroidSigningKeyPass=${{ secrets.KEYSTORE_PASSWORD }} `
        /p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}

    # 1. Vẫn giữ Artifact để bạn kiểm tra nội bộ nhanh
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoodTour-App-Debug
        path: FoodTour.Mobile/bin/Release/net9.0-android/android-arm64/*-Signed.apk
        retention-days: 90

    # 2. Tự động tạo Release khi bạn gắn thẻ (Tag) phiên bản
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: FoodTour.Mobile/bin/Release/net9.0-android/android-arm64/*-Signed.apk
        name: Release ${{ github.ref_name }}
        body: "Bản cập nhật mới nhất cho ứng dụng FoodTour."
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}